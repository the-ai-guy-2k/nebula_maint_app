name: Docker Build and Publish

on:
  push:
    branches:
      - deployable
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker Hub secrets
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is missing or empty."
            exit 1
          fi
          if [ -z "$DH_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN secret is missing or empty."
            exit 1
          fi
          echo "Docker Hub credentials detected."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: taig2k/nebula_maint_app:v0.1
          push: true

      - name: Publication summary
        run: |
          {
            echo "## Docker Hub Publication"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Repository | taig2k/nebula_maint_app |"
            echo "| Tag | v0.1 |"
            echo "| Result | Published |"
            echo "| Image | docker.io/taig2k/nebula_maint_app:v0.1 |"
          } >> "$GITHUB_STEP_SUMMARY"
